<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Маска, которая "откусывает" кусок -->
    <mask id="biteMask">
      <rect width="100" height="100" fill="white" />
      <circle cx="80" cy="75" r="22" fill="black" />
    </mask>
  </defs>
  <!-- Сама звездочка. Цвет fill="#F97316" (оранжевый), можно поменять на свой -->
  <polygon 
    points="50,10 61,40 93,40 67,59 77,90 50,71 23,90 33,59 7,40 39,40" 
    fill="#f8ffe4" 
    mask="url(#biteMask)" 
  />
</svg>
